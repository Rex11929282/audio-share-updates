name: MCB-CS2-build

on:
  push:
    branches: [velocity-lua-build-temp]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream source
        shell: pwsh
        run: |
          git clone https://github.com/0x12F/velocity-improved.git mcb-src
          git -C mcb-src checkout 4392221937f12490dcf14efcba4e85115ab580c9

      - name: Apply crash, Lua, Chinese UI, performance and MCB branding patches
        shell: pwsh
        run: |
          python velocity-build/apply_source_fix.py mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/apply_lua.py mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/apply_zh_ui.py mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/apply_layout_brand.py mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/apply_ui_v2.py mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/apply_perf_v3.py mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/apply_brand_v4.py mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate MCB v4 source and branding
        shell: pwsh
        run: |
          $r='mcb-src\cs2\MCB-CS2'
          if(-not (Test-Path "$r\MCB-CS2.vcxproj")){throw 'MCB project file missing'}
          if(-not (Test-Path 'mcb-src\cs2\MCB-CS2.slnx')){throw 'MCB solution file missing'}

          $checks=@(
            @("$r\project\core\systems\impl\prediction.cpp", 'missing schema %s::%s (simulate)'),
            @("$r\project\core\scripting\lua_manager.cpp", 'screen_size_fn'),
            @("$r\project\core\scripting\lua_manager.cpp", 'hud_line_fn'),
            @("$r\project\core\scripting\lua_manager.cpp", 'lua_setglobal( L, "mcb" );'),
            @("$r\project\core\scripting\lua_manager.cpp", '[MCB Lua]'),
            @("$r\project\core\scripting\scripting.hpp", 'script_statuses'),
            @("$r\project\core\rendering\impl\menu\menu.config.cpp", '已開啟的 Lua'),
            @("$r\project\core\rendering\impl\menu\menu.config.cpp", '面板寬度##ui_panel_width'),
            @("$r\project\core\rendering\impl\widgets.cpp", '"MCB"'),
            @("$r\project\utilities\diag.hpp", 'L"MCB_init.log"'),
            @("$r\project\utilities\diag.hpp", 'L"MCB_crash.dmp"'),
            @("$r\project\mcb_version.rc", 'VALUE "ProductName", "MCB'),
            @("$r\MCB-CS2.vcxproj", '<TargetName>MCB-CS2-dev</TargetName>'),
            @("$r\MCB-CS2.vcxproj", '<RootNamespace>mcbcs2</RootNamespace>'),
            @("$r\vcpkg.json", '"name": "mcb-cs2"'),
            @("$r\lua_examples\snow_hud.lua", 'MCB Lua 雪花 HUD：運行中'),
            @("$r\project\external\xdraw\xui\xui.cpp", 'const auto drag_zone = rect{'),
            @("$r\project\external\xdraw\xui\xui.cpp", 'moving_or_resizing'),
            @("$r\project\core\rendering\impl\menu\menu.core.cpp", 'Defer CJK glyph warm-up')
          )
          foreach($c in $checks) {
            if(-not (Select-String -LiteralPath $c[0] -SimpleMatch $c[1] -Quiet)) { throw "missing marker $($c[1])" }
          }

          $oldChecks=@(
            @("$r\project\core\rendering\impl\widgets.cpp", 'velocity.cat'),
            @("$r\project\utilities\diag.hpp", 'velocity_init.log'),
            @("$r\project\utilities\diag.hpp", 'velocity_crash.dmp'),
            @("$r\project\utilities\addresses\impl\functions.cpp", 'velocity_dummy_window'),
            @("$r\project\core\features\world\impl\scene.cpp", 'velocity_skybox_'),
            @("$r\project\core\scripting\lua_manager.cpp", 'lua_setglobal( L, "velocity" );')
          )
          foreach($c in $oldChecks) {
            if(Select-String -LiteralPath $c[0] -SimpleMatch $c[1] -Quiet){throw "old brand marker remains: $($c[1])"}
          }

          $ctx=Get-Content "$r\project\core\rendering\impl\context.cpp" -Raw
          $begin=$ctx.IndexOf('xdraw::begin_frame( true )')
          $lua=$ctx.IndexOf('scripting::g_lua.on_frame( );')
          $end=$ctx.IndexOf('xdraw::end_frame( )')
          if($begin -lt 0 -or $lua -lt $begin -or $end -lt $lua){throw 'Lua HUD callback is outside xdraw frame'}

          $scaledX=960.0*1440.0/1920.0
          $scaledY=540.0*1080.0/1080.0
          if([math]::Abs($scaledX-720.0)-gt0.001 -or [math]::Abs($scaledY-540.0)-gt0.001){throw 'mouse scaling failed'}

      - name: Locate Visual Studio and vcpkg
        shell: pwsh
        run: |
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if(-not $vs){throw 'Visual Studio not found'}
          "VSROOT=$vs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $v=@("$vs\VC\vcpkg",'C:\vcpkg') | Where-Object { Test-Path "$_\vcpkg.exe" } | Select-Object -First 1
          if(-not $v){throw 'vcpkg not found'}
          "VCPKG_ROOT=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build MCB Development DLL
        shell: pwsh
        run: |
          $msbuild="$env:VSROOT\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild 'mcb-src\cs2\MCB-CS2\MCB-CS2.vcxproj' /m /p:Configuration=Development /p:Platform=x64 /p:VcpkgRoot="$env:VCPKG_ROOT\"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: MCB Lua snow HUD runtime smoke test
        shell: pwsh
        run: |
          $root=Resolve-Path 'mcb-src\cs2\MCB-CS2'
          $lua=Get-ChildItem "$root\vcpkg_installed" -Recurse -Filter lua.lib | Where-Object { $_.FullName -notmatch '\\debug\\' } | Select-Object -First 1
          $hpp=Get-ChildItem "$root\vcpkg_installed" -Recurse -Filter lua.hpp | Select-Object -First 1
          if(-not $lua -or -not $hpp){throw 'Lua headers/library not found'}
          $inc=$hpp.Directory.FullName
          $devcmd="$env:VSROOT\Common7\Tools\VsDevCmd.bat"
          $src=Resolve-Path 'velocity-build\lua_snow_smoke.cpp'
          $snow=Resolve-Path 'mcb-src\cs2\MCB-CS2\lua_examples\snow_hud.lua'
          $cmd='"'+$devcmd+'" -arch=x64 -host_arch=x64 && cl /MT /nologo /EHsc /std:c++20 /I"'+$inc+'" "'+$src+'" "'+$lua.FullName+'" /Fe:mcb_lua_snow_smoke.exe && mcb_lua_snow_smoke.exe "'+$snow+'"'
          cmd.exe /d /s /c $cmd
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Validate MCB DLL metadata and package
        shell: pwsh
        run: |
          $dll='mcb-src\cs2\bin\MCB-CS2-dev.dll'
          if(-not(Test-Path $dll)){throw 'MCB DLL missing'}
          $b=[IO.File]::ReadAllBytes($dll)
          if($b.Length-lt100000 -or $b[0]-ne0x4d -or $b[1]-ne0x5a){throw 'invalid PE DLL'}

          $utf=[Text.Encoding]::UTF8.GetString($b)
          $uni=[Text.Encoding]::Unicode.GetString($b)
          foreach($marker in @('Lua 腳本管理','已開啟的 Lua','MCB')) {
            if(-not ($utf.Contains($marker) -or $uni.Contains($marker))){throw "DLL marker absent: $marker"}
          }
          foreach($old in @('velocity.cat','velocity_init.log','velocity_crash.dmp','velocity_dummy_window','velocity_skybox_')) {
            if($utf.Contains($old) -or $uni.Contains($old)){throw "old brand marker in DLL: $old"}
          }

          $ver=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll))
          if($ver.ProductName -ne 'MCB'){throw "ProductName mismatch: $($ver.ProductName)"}
          if($ver.FileDescription -ne 'MCB'){throw "FileDescription mismatch: $($ver.FileDescription)"}
          if($ver.OriginalFilename -ne 'MCB-CS2-dev.dll'){throw "OriginalFilename mismatch: $($ver.OriginalFilename)"}

          $msvc=(Get-ChildItem "$env:VSROOT\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name
          $dump="$env:VSROOT\VC\Tools\MSVC\$msvc\bin\Hostx64\x64\dumpbin.exe"
          & $dump /headers $dll | Out-File dll_headers.txt
          & $dump /imports $dll | Out-File dll_imports.txt
          if(Select-String -Path dll_imports.txt -Pattern 'lua[^ ]*\.dll' -Quiet){throw 'Lua must be statically linked'}

          $hash=(Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force release\scripts | Out-Null
          Copy-Item $dll release\MCB-CS2-v4.dll
          Copy-Item 'mcb-src\cs2\MCB-CS2\lua_examples\hello.lua' release\scripts\hello.lua
          Copy-Item 'mcb-src\cs2\MCB-CS2\lua_examples\snow_hud.lua' release\scripts\snow_hud.lua
          "sha256=$hash`nsize=$($b.Length)`nproduct_name=MCB`nfile_description=MCB`noriginal_filename=MCB-CS2-dev.dll`nmsbuild=PASS`nmcb_full_branding=PASS`nold_brand_markers_absent=PASS`nlua_public_api_mcb=PASS`nlua_snow_hud_runtime_smoke=PASS`npe=PASS`nlua_static_link=PASS`nlua_visible_status_list=PASS`nui_drag_performance=PASS`nui_resize_performance=PASS`ndeferred_cjk_prewarm=PASS`nmouse_1440x1080_scaling=PASS`nschema_crash_guard=PASS" | Set-Content release\MCB_BUILD_TEST_RESULTS.txt -Encoding utf8
          Copy-Item dll_headers.txt,dll_imports.txt release

      - uses: actions/upload-artifact@v4
        with:
          name: MCB-CS2-v4-tested
          path: release
          if-no-files-found: error
