name: MCB Unified Source and Native Component Validation

on:
  push:
    branches: [mcb-unified-source-20260927, mcb-ui-only-delivery-20260928, mcb-ui-branding-20260928, mcb-major-noncombat-20260928, mcb-all-feature-expansion-20260928, mcb-advanced-expansion-20260928]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: mcb-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and expand source-only integration payload
        run: python velocity-build/unified-20260927/decode.py
      - name: Patch translation audit policy
        run: python velocity-build/ui-only-delivery-20260928/patch_translation_test.py
      - name: Prepare report
        run: python velocity-build/cs2_update_20260925.py run-step 'Prepare report'
      - name: Test existing patch extraction
        run: python velocity-build/cs2_update_20260925.py test
      - name: Locate native Windows toolchain
        run: python velocity-build/cs2_update_20260925.py run-step 'Locate Visual Studio and vcpkg'
      - name: Fetch pinned reviewed source
        run: python velocity-build/cs2_update_20260925.py run-step 'Fetch pinned MCB source'
      - name: Remove upstream webhook and repair listener patch
        run: python velocity-build/cs2_update_20260925.py prepare
      - name: Fetch exact LuaJIT source
        run: python velocity-build/cs2_update_20260925.py run-step 'Fetch exact LuaJIT revision'
      - name: Build Windows x64 LuaJIT
        run: python velocity-build/cs2_update_20260925.py run-step 'Build exact LuaJIT x64 with MSVC'
      - name: Test LuaJIT version FFI and generated bytecode
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate LuaJIT version, FFI and bytecode'
      - name: Test value bootstrap
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate Nix LuaJIT cdata value bootstrap'
      - name: Test render bootstrap with synthetic native functions
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate Nix render Lua bootstrap'
      - name: Test independent LuaJIT loader without game
        run: python velocity-build/cs2_update_20260925.py run-step 'Compile and run independent DLL loader smoke'
      - name: Apply reviewed historical source patch chain
        run: python velocity-build/cs2_update_20260925.py run-step 'Apply MCB and Nix runtime patch chain'
      - name: Check pre-integration coordinate patch
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate responsive UI input mapping'
      - name: Check pre-integration config and shot patch
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate CFG preset and shot evidence integration'
      - name: Pin companion runtime hash
        run: python velocity-build/cs2_update_20260925.py run-step 'Pin built LuaJIT hash into runtime manifest'
      - name: Inspect runtime integration
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate dual runtime source integration'
      - name: Audit listener and absence of webhook
        run: python velocity-build/cs2_update_20260925.py audit
      - name: Integrate native features ownership movement UI presets and batch guards
        run: |
          python velocity-build/unified/mcb_unify.py mcb-src/cs2/MCB-CS2 > release/UNIFIED_PATCH.log
          if ($LASTEXITCODE -ne 0) { Get-Content release/UNIFIED_PATCH.log; exit $LASTEXITCODE }
          python velocity-build/ui_rework_20260927.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/UI_REWORK.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/weapon_ui_polish_20260927.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/WEAPON_UI_POLISH.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/weapon_ui_compile_fix_20260927.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/WEAPON_UI_COMPILE_FIX.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/ui_bugfix_polish_20260927.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/UI_BUGFIX_POLISH.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/ui_bugfix_compile_fix_20260927.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/UI_BUGFIX_COMPILE_FIX.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/ui-only-delivery-20260928/apply.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/UI_ONLY_DELIVERY.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/ui-only-delivery-20260928/compile_fix.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/UI_ONLY_COMPILE_FIX.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/ui-only-delivery-20260928/bugfix_round2_20260928.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/BUGFIX_ROUND2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/ui-only-delivery-20260928/bugfix_round2_compile_fix.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/BUGFIX_ROUND2_COMPILE_FIX.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python velocity-build/ui-branding-20260928/apply.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/UI_BRANDING.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_UI_BRANDING_20260928.json release/
          python velocity-build/major-noncombat-20260928/apply.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/MAJOR_NONCOMBAT.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_MAJOR_NONCOMBAT_20260928.json release/
          python velocity-build/all-feature-expansion-20260928/apply.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/ALL_FEATURE_EXPANSION.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_ALL_FEATURE_EXPANSION_20260928.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_ALL_FEATURE_EXPANSION.patch release/
          python velocity-build/all-feature-expansion-20260928/post_fix.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/ALL_FEATURE_EXPANSION_FIX.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_ALL_FEATURE_EXPANSION_FIX_20260928.json release/
          python velocity-build/advanced-expansion-20260928/apply.py mcb-src/cs2/MCB-CS2 2>&1 | Tee-Object -FilePath release/ADVANCED_EXPANSION.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_ADVANCED_EXPANSION_20260928.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_ADVANCED_EXPANSION.patch release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_UI_ONLY_DELIVERY.patch release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_UI_ONLY_COMPILE_FIX.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_BUGFIX_ROUND2.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_BUGFIX_ROUND2_COMPILE_FIX.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_UNIFIED_CHANGES.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_UI_REWORK.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_WEAPON_UI_POLISH.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_WEAPON_UI_COMPILE_FIX.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_UI_BUGFIX_POLISH.json release/
          Copy-Item mcb-src/cs2/MCB-CS2/MCB_UI_BUGFIX_COMPILE_FIX.json release/
      - name: Compile and run production helper and translation tests
        run: python velocity-build/unified/run_tests.py mcb-src/cs2/MCB-CS2
      - name: Compile complete main DLL
        run: python velocity-build/cs2_update_20260925.py run-step 'Build MCB Ship x64'
      - name: Exercise actual D3D11 WARP XUI and native config roundtrips
        run: python velocity-build/unified/run_tests.py mcb-src/cs2/MCB-CS2 --native-ui
      - name: Package exact source candidate
        run: |
          python velocity-build/cs2_update_20260925.py package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          MCB unified source build. One main game DLL, optional separate LuaJIT runtime.
          This is a source rebuild, not a byte-for-byte transplantation of all donor b16 functions.
          Native feature pages replace detached gameplay preview controls.
          Tests cover isolated production components on Windows, not CS2 gameplay or real FPS.
          All original uploaded binaries and scripts are unchanged.
          Full Nixware compatibility and all dynamic text are not certified.
          '@ | Set-Content release/UNIFIED_SCOPE.txt -Encoding utf8
      - name: Preserve exact new inputs
        if: always()
        run: |
          New-Item -ItemType Directory -Force release/unified-build-inputs | Out-Null
          Copy-Item .github/workflows/mcb-unified-20260927.yml release/unified-build-inputs/
          Copy-Item velocity-build/unified-20260927 release/unified-build-inputs/ -Recurse
          if (Test-Path velocity-build/unified) { Copy-Item velocity-build/unified release/unified-build-inputs/ -Recurse }
          Copy-Item velocity-build/ui_rework_20260927.py release/unified-build-inputs/
          Copy-Item velocity-build/weapon_ui_polish_20260927.py release/unified-build-inputs/
          Copy-Item velocity-build/weapon_ui_compile_fix_20260927.py release/unified-build-inputs/
          Copy-Item velocity-build/ui_bugfix_polish_20260927.py release/unified-build-inputs/
          Copy-Item velocity-build/ui_bugfix_compile_fix_20260927.py release/unified-build-inputs/
          Copy-Item velocity-build/ui-only-delivery-20260928 release/unified-build-inputs/ -Recurse
          Copy-Item velocity-build/ui-branding-20260928 release/unified-build-inputs/ -Recurse
          Copy-Item velocity-build/major-noncombat-20260928 release/unified-build-inputs/ -Recurse
          Copy-Item velocity-build/all-feature-expansion-20260928 release/unified-build-inputs/ -Recurse
          Copy-Item velocity-build/advanced-expansion-20260928 release/unified-build-inputs/ -Recurse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MCB-Unified-${{ github.run_id }}
          path: release
          if-no-files-found: error
          retention-days: 14
