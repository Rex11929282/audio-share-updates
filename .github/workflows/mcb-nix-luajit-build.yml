name: MCB Nix LuaJIT Runtime Slice A

on:
  push:
    branches: [mcb-nix-luajit-runtime]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Prepare report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          @(
            "workflow=MCB Nix LuaJIT Runtime Slice A"
            "run=$env:GITHUB_RUN_ID"
            "commit=$env:GITHUB_SHA"
            "full_nixware_api=NOT_COMPLETED"
            "in_game_runtime=NOT_TESTED"
          ) | Set-Content release/NIX_RUNTIME_BUILD_STATUS.txt -Encoding utf8

      - name: Locate Visual Studio and vcpkg
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          "VSROOT=$vs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $v = @("$vs\VC\vcpkg", 'C:\vcpkg') | Where-Object { Test-Path "$_\vcpkg.exe" } | Select-Object -First 1
          if (-not $v) { throw 'vcpkg not found' }
          "VCPKG_ROOT=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch pinned MCB source
        shell: pwsh
        run: |
          git clone https://github.com/0x12F/velocity-improved.git mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C mcb-src checkout 4392221937f12490dcf14efcba4e85115ab580c9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch exact LuaJIT revision
        shell: pwsh
        run: |
          git clone https://github.com/LuaJIT/LuaJIT.git luajit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C luajit checkout a4f56a459a588ae768801074b46ba0adcfb49eb1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git -C luajit rev-parse HEAD).Trim()
          if ($actual -ne 'a4f56a459a588ae768801074b46ba0adcfb49eb1') { throw "LuaJIT revision mismatch: $actual" }
          'luajit_source_revision=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Build exact LuaJIT x64 with MSVC
        shell: pwsh
        run: |
          $devcmd = "$env:VSROOT\Common7\Tools\VsDevCmd.bat"
          $cmd = '"' + $devcmd + '" -arch=x64 -host_arch=x64 && cd /d "' + (Resolve-Path 'luajit\src') + '" && call msvcbuild.bat'
          cmd.exe /d /s /c $cmd 2>&1 | Tee-Object -FilePath release/LUAJIT_BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in @('luajit\src\lua51.dll','luajit\src\lua51.lib','luajit\src\luajit.exe')) {
            if (-not (Test-Path $f)) { throw "LuaJIT output missing: $f" }
          }
          'luajit_msvc_x64_build=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Validate LuaJIT version, FFI and bytecode
        shell: pwsh
        run: |
          @'
          assert(_VERSION == "Lua 5.1", _VERSION)
          assert(jit.version == "LuaJIT 2.1.1736781742", jit.version)
          assert(jit.os == "Windows" and jit.arch == "x64")
          local ffi = require("ffi")
          assert(ffi.sizeof("void *") == 8)
          assert(ffi.abi("64bit") and ffi.abi("le"))
          ffi.cdef[[typedef struct { double x; double y; double z; } mcb_ci_vec3;]]
          local T = ffi.typeof("mcb_ci_vec3")
          local v = T(1, 2, 3)
          assert(type(v) == "cdata" and ffi.istype(T, v))
          local a = ffi.new("int[2]", {17, 29})
          local p = ffi.cast("int*", a)
          assert(p[0] == 17 and p[1] == 29)
          local cb = ffi.cast("int(*)(int)", function(x) return x + 1 end)
          assert(cb(41) == 42)
          cb:free()
          print("MCB_NIX_EXACT_FFI=PASS")
          '@ | Set-Content nix_exact_probe.lua -Encoding ascii

          & .\luajit\src\luajit.exe .\nix_exact_probe.lua 2>&1 | Tee-Object -FilePath release/LUAJIT_RUNTIME_PROBE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location .\luajit\src
          & .\luajit.exe -b ..\..\nix_exact_probe.lua ..\..\nix_exact_probe.luac
          $bytecodeExit = $LASTEXITCODE
          Pop-Location
          if ($bytecodeExit -ne 0 -or -not (Test-Path .\nix_exact_probe.luac)) { throw 'bytecode compile failed' }
          & .\luajit\src\luajit.exe .\nix_exact_probe.luac
          if ($LASTEXITCODE -ne 0) { throw 'bytecode execution failed' }

          'luajit_exact_version=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'luajit_ffi=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'luajit_bytecode_self_compat=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Compile and run independent DLL loader smoke
        shell: pwsh
        run: |
          $devcmd = "$env:VSROOT\Common7\Tools\VsDevCmd.bat"
          $src = (Resolve-Path 'velocity-build\nix_luajit_smoke.cpp').Path
          $cmd = '"' + $devcmd + '" -arch=x64 -host_arch=x64 && cl /MT /nologo /EHsc /std:c++20 /DNOMINMAX "' + $src + '" /Fe:nix_luajit_smoke.exe'
          cmd.exe /d /s /c $cmd 2>&1 | Tee-Object -FilePath release/NIX_DLL_LOADER_BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = (Resolve-Path 'luajit\src\lua51.dll').Path
          & .\nix_luajit_smoke.exe $dll 2>&1 | Tee-Object -FilePath release/NIX_DLL_LOADER_SMOKE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'independent_lua51_loader_smoke=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Apply MCB and Nix runtime patch chain
        shell: pwsh
        run: |
          $patches = @(
            'apply_source_fix.py',
            'apply_lua.py',
            'apply_zh_ui.py',
            'apply_layout_brand.py',
            'apply_ui_v2.py',
            'apply_perf_v3.py',
            'apply_brand_v4.py',
            'apply_stability_v5.py',
            'apply_panel_v5.py',
            'apply_registry_v5.py',
            'apply_panel_fix_v5.py',
            'apply_release_v5.py',
            'apply_release_thread_crt_v5.py',
            'apply_release_jobs_fix_v5.py',
            'apply_v6_native_ui.py',
            'apply_v61_custom_pages.py',
            'apply_v62_ui.py',
            'apply_nix_luajit.py'
          )
          foreach ($patch in $patches) {
            "===== $patch =====" | Tee-Object -FilePath release/PATCH.log -Append
            python "velocity-build/$patch" mcb-src 2>&1 | Tee-Object -FilePath release/PATCH.log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pin built LuaJIT hash into runtime manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'luajit\src\lua51.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = 'mcb-src\cs2\MCB-CS2\project\core\scripting\nix_luajit_manifest.hpp'
          if (-not (Test-Path $manifest)) { throw 'generated Nix LuaJIT manifest missing' }
          @"
          #pragma once
          #define MCB_NIX_LUAJIT_REVISION "a4f56a459a588ae768801074b46ba0adcfb49eb1"
          #define MCB_NIX_LUAJIT_VERSION "LuaJIT 2.1.1736781742"
          #define MCB_NIX_LUAJIT_SHA256 "$hash"
          "@ | Set-Content $manifest -Encoding ascii
          "lua51_sha256=$hash" | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'runtime_hash_manifest=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Validate dual runtime source integration
        shell: pwsh
        run: |
          $root = 'mcb-src\cs2\MCB-CS2'
          $checks = @(
            @("$root\project\core\scripting\nix_runtime.cpp", 'LuaJIT 2.1.1736781742'),
            @("$root\project\core\scripting\nix_runtime.cpp", 'require("ffi")'),
            @("$root\project\core\scripting\nix_runtime.cpp", 'scripts" / L"nixware" / L"enabled'),
            @("$root\project\core\scripting\nix_runtime.cpp", 'LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR'),
            @("$root\project\entry.cpp", 'scripting::g_nix.initialize'),
            @("$root\project\entry.cpp", 'scripting::g_nix.shutdown'),
            @("$root\project\core\rendering\impl\context.cpp", 'scripting::g_nix.on_frame'),
            @("$root\MCB-CS2.vcxproj", 'project\core\scripting\nix_runtime.cpp')
          )
          foreach ($c in $checks) {
            if (-not (Select-String -LiteralPath $c[0] -SimpleMatch $c[1] -Quiet)) {
              throw "missing integration marker: $($c[1])"
            }
          }
          'dual_runtime_source_integration=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Build MCB Ship x64
        shell: pwsh
        run: |
          $msbuild = "$env:VSROOT\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild 'mcb-src\cs2\MCB-CS2\MCB-CS2.vcxproj' /m /t:Rebuild /p:Configuration=Ship /p:Platform=x64 /p:VcpkgRoot="$env:VCPKG_ROOT\" /nologo "/flp:logfile=$pwd\release\MSBUILD.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'mcb_ship_x64_build=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Package candidate
        shell: pwsh
        run: |
          $dll = 'mcb-src\cs2\bin\MCB-CS2-v6.2-exact-panel.dll'
          $pdb = 'mcb-src\cs2\bin\MCB-CS2-v6.2-exact-panel.pdb'
          if (-not (Test-Path $dll) -or -not (Test-Path $pdb)) { throw 'MCB DLL/PDB missing' }

          New-Item -ItemType Directory -Force release\runtime | Out-Null
          New-Item -ItemType Directory -Force release\source | Out-Null

          Copy-Item $dll release\
          Copy-Item $pdb release\
          Copy-Item 'luajit\src\lua51.dll' release\runtime\
          Copy-Item 'luajit\COPYRIGHT' release\runtime\LuaJIT-COPYRIGHT.txt
          Copy-Item 'velocity-build\overlay\nix_runtime.cpp' release\source\
          Copy-Item 'velocity-build\overlay\nix_runtime.hpp' release\source\
          Copy-Item 'velocity-build\apply_nix_luajit.py' release\source\
          Copy-Item 'mcb-src\cs2\MCB-CS2\project\core\scripting\nix_luajit_manifest.hpp' release\source\

          $mcbHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          "mcb_dll_sha256=$mcbHash" | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'slice_a_exact_luajit_ffi=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'nixware_entity_api=NOT_COMPLETED' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'nixware_render_api=NOT_COMPLETED' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'nixware_mutating_events=NOT_COMPLETED' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'reference_nixware_bytecode_diff=NOT_TESTED' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'workflow_result=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Record failure
        if: failure()
        shell: pwsh
        run: |
          'workflow_result=FAIL' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MCB-Nix-LuaJIT-SliceA
          path: release
          if-no-files-found: error
