name: MCB Nix LuaJIT Runtime Compatibility Build

on:
  push:
    branches: [mcb-nix-luajit-runtime, mcb-nix-luajit-full-compat, mcb-nix-integrated-ui-cfg-shot, mcb-cfg-shot-work]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mcb-nix-luajit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Prepare report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          @(
            "workflow=MCB Nix LuaJIT Runtime Compatibility Build"
            "run=$env:GITHUB_RUN_ID"
            "commit=$env:GITHUB_SHA"
            "full_nixware_api=NOT_COMPLETED"
            "in_game_runtime=NOT_TESTED"
          ) | Set-Content release/NIX_RUNTIME_BUILD_STATUS.txt -Encoding utf8

      - name: Locate Visual Studio and vcpkg
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          "VSROOT=$vs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $v = @("$vs\VC\vcpkg", 'C:\vcpkg') | Where-Object { Test-Path "$_\vcpkg.exe" } | Select-Object -First 1
          if (-not $v) { throw 'vcpkg not found' }
          "VCPKG_ROOT=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch pinned MCB source
        shell: pwsh
        run: |
          git clone https://github.com/0x12F/velocity-improved.git mcb-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C mcb-src checkout 4392221937f12490dcf14efcba4e85115ab580c9
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch exact LuaJIT revision
        shell: pwsh
        run: |
          git clone https://github.com/LuaJIT/LuaJIT.git luajit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C luajit checkout a4f56a459a588ae768801074b46ba0adcfb49eb1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git -C luajit rev-parse HEAD).Trim()
          if ($actual -ne 'a4f56a459a588ae768801074b46ba0adcfb49eb1') { throw "LuaJIT revision mismatch: $actual" }
          'luajit_source_revision=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Build exact LuaJIT x64 with MSVC
        shell: pwsh
        run: |
          $devcmd = "$env:VSROOT\Common7\Tools\VsDevCmd.bat"
          $cmd = '"' + $devcmd + '" -arch=x64 -host_arch=x64 && cd /d "' + (Resolve-Path 'luajit\src') + '" && call msvcbuild.bat'
          cmd.exe /d /s /c $cmd 2>&1 | Tee-Object -FilePath release/LUAJIT_BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in @('luajit\src\lua51.dll','luajit\src\lua51.lib','luajit\src\luajit.exe')) {
            if (-not (Test-Path $f)) { throw "LuaJIT output missing: $f" }
          }
          'luajit_msvc_x64_build=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Validate LuaJIT version, FFI and bytecode
        shell: pwsh
        run: |
          @'
          assert(_VERSION == "Lua 5.1", _VERSION)
          assert(jit.version == "LuaJIT 2.1.1736781742", jit.version)
          assert(jit.os == "Windows" and jit.arch == "x64")
          local ffi = require("ffi")
          assert(ffi.sizeof("void *") == 8)
          assert(ffi.abi("64bit") and ffi.abi("le"))
          ffi.cdef[[typedef struct { double x; double y; double z; } mcb_ci_vec3;]]
          local T = ffi.typeof("mcb_ci_vec3")
          local v = T(1, 2, 3)
          assert(type(v) == "cdata" and ffi.istype(T, v))
          local a = ffi.new("int[2]", {17, 29})
          local p = ffi.cast("int*", a)
          assert(p[0] == 17 and p[1] == 29)
          local cb = ffi.cast("int(*)(int)", function(x) return x + 1 end)
          assert(cb(41) == 42)
          cb:free()
          print("MCB_NIX_EXACT_FFI=PASS")
          '@ | Set-Content nix_exact_probe.lua -Encoding ascii

          & .\luajit\src\luajit.exe .\nix_exact_probe.lua 2>&1 | Tee-Object -FilePath release/LUAJIT_RUNTIME_PROBE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Push-Location .\luajit\src
          & .\luajit.exe -b ..\..\nix_exact_probe.lua ..\..\nix_exact_probe.luac
          $bytecodeExit = $LASTEXITCODE
          Pop-Location
          if ($bytecodeExit -ne 0 -or -not (Test-Path .\nix_exact_probe.luac)) { throw 'bytecode compile failed' }
          & .\luajit\src\luajit.exe .\nix_exact_probe.luac
          if ($LASTEXITCODE -ne 0) { throw 'bytecode execution failed' }

          'luajit_exact_version=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'luajit_ffi=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'luajit_bytecode_self_compat=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Validate Nix LuaJIT cdata value bootstrap
        shell: pwsh
        run: |
          $header = Get-Content 'velocity-build\overlay\nix_value_bootstrap.hpp' -Raw
          $match = [regex]::Match($header, '(?s)R"MCB_NIX\((.*?)\)MCB_NIX";')
          if (-not $match.Success) { throw 'cannot extract Nix value bootstrap' }
          [System.IO.File]::WriteAllText(
            (Join-Path $pwd 'nix_value_bootstrap_test.lua'),
            $match.Groups[1].Value,
            [System.Text.UTF8Encoding]::new($false))
          Push-Location .\luajit\src
          & .\luajit.exe ..\..\nix_value_bootstrap_test.lua 2>&1 | Tee-Object -FilePath ..\..\release\NIX_VALUE_BOOTSTRAP.log
          $valueExit = $LASTEXITCODE
          Pop-Location
          if ($valueExit -ne 0) { throw 'Nix cdata value bootstrap failed' }
          'nix_cdata_value_bootstrap=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Validate Nix render Lua bootstrap
        shell: pwsh
        run: |
          $values = Get-Content 'velocity-build\overlay\nix_value_bootstrap.hpp' -Raw
          $v = [regex]::Match($values, '(?s)R"MCB_NIX\((.*?)\)MCB_NIX";')
          if (-not $v.Success) { throw 'cannot extract value bootstrap' }

          $render = Get-Content 'velocity-build\overlay\nix_render_bootstrap.hpp' -Raw
          $r = [regex]::Match($render, '(?s)R"MCB_NIX_RENDER\((.*?)\)MCB_NIX_RENDER";')
          if (-not $r.Success) { throw 'cannot extract render bootstrap' }

          $stub = @'
          local calls = {}
          function __mcb_render_screen_size() return 1920,1080 end
          function __mcb_render_frame_count() return 77 end
          function __mcb_render_frame_time() return 0.015625 end
          function __mcb_render_world_to_screen(x,y,z)
            if z < 0 then return nil end
            return x+10,y+20
          end
          local font_proxy = newproxy(true)
          function __mcb_render_setup_font(filename,size,flags)
            calls.setup_font={filename,size,flags}
            return font_proxy
          end
          function __mcb_render_calc_text_size(text,font,size)
            assert(font==font_proxy)
            calls.calc_text={text,font,size}
            return 42,12
          end
          function __mcb_render_text(...)
            calls.text={...}
          end
          function __mcb_render_line(...) calls.line={...} end
          function __mcb_render_rect(...) calls.rect={...} end
          function __mcb_render_rect_filled(...) calls.rect_filled={...} end
          function __mcb_render_rect_filled_fade(...) calls.fade={...} end
          function __mcb_render_circle(...) calls.circle={...} end
          function __mcb_render_circle_filled(...) calls.circle_filled={...} end
          function __mcb_render_push_clip(...) calls.push_clip={...} end
          function __mcb_render_pop_clip(...) calls.pop_clip=true end
          '@

          $assertions = @'
          local s=render.screen_size()
          assert(type(s)=="cdata" and s.x==1920 and s.y==1080)
          assert(render.frame_count()==77)
          assert(math.abs(render.frame_time()-0.015625)<1e-9)
          local p=render.world_to_screen(vec3_t(1,2,3))
          assert(type(p)=="cdata" and p.x==11 and p.y==22)
          assert(render.world_to_screen(vec3_t(1,2,-1))==nil)
          local font=render.setup_font("C:/Windows/Fonts/msyh.ttc",12,400)
          assert(type(font)=="userdata")
          assert(calls.setup_font and calls.setup_font[1]=="C:/Windows/Fonts/msyh.ttc" and calls.setup_font[2]==12 and calls.setup_font[3]==400)
          local ts=render.calc_text_size("测试",font,12)
          assert(type(ts)=="cdata" and ts.x==42 and ts.y==12)
          render.text("测试",font,vec2_t(7,8),color_t(1,.5,0,1),12)
          assert(calls.text and calls.text[1]=="测试" and calls.text[3]==7 and calls.text[4]==8 and calls.text[9]==12)
          render.line(vec2_t(1,2),vec2_t(3,4),color_t(1,.5,0,1),2)
          assert(calls.line and calls.line[1]==1 and calls.line[9]==2)
          render.rect_filled(vec2_t(10,20),vec2_t(30,40),color_t(1,1,1,.5),4)
          assert(calls.rect_filled and calls.rect_filled[9]==4)
          render.circle(vec2_t(50,60),10,24,color_t(1,0,0,1),3)
          assert(calls.circle and calls.circle[4]==24 and calls.circle[9]==3)
          render.push_clip_rect(vec2_t(0,0),vec2_t(100,100),false)
          assert(calls.push_clip and calls.push_clip[5]==false)
          render.pop_clip_rect()
          assert(calls.pop_clip==true)
          print("MCB_NIX_RENDER_BOOTSTRAP=PASS")
          '@

          $nl = [Environment]::NewLine
          [System.IO.File]::WriteAllText(
            (Join-Path $pwd 'nix_render_bootstrap_test.lua'),
            $v.Groups[1].Value + $nl + $stub + $nl + $r.Groups[1].Value + $nl + $assertions,
            [System.Text.UTF8Encoding]::new($false))

          Push-Location .\luajit\src
          & .\luajit.exe ..\..\nix_render_bootstrap_test.lua 2>&1 | Tee-Object -FilePath ..\..\release\NIX_RENDER_BOOTSTRAP.log
          $renderExit = $LASTEXITCODE
          Pop-Location
          if ($renderExit -ne 0) { throw 'Nix render Lua bootstrap failed' }
          'nix_render_lua_bootstrap=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Compile and run independent DLL loader smoke
        shell: pwsh
        run: |
          $devcmd = "$env:VSROOT\Common7\Tools\VsDevCmd.bat"
          $src = (Resolve-Path 'velocity-build\nix_luajit_smoke.cpp').Path
          $cmd = '"' + $devcmd + '" -arch=x64 -host_arch=x64 && cl /MT /nologo /EHsc /std:c++20 /DNOMINMAX "' + $src + '" /Fe:nix_luajit_smoke.exe'
          cmd.exe /d /s /c $cmd 2>&1 | Tee-Object -FilePath release/NIX_DLL_LOADER_BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = (Resolve-Path 'luajit\src\lua51.dll').Path
          & .\nix_luajit_smoke.exe $dll 2>&1 | Tee-Object -FilePath release/NIX_DLL_LOADER_SMOKE.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'independent_lua51_loader_smoke=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Apply MCB and Nix runtime patch chain
        shell: pwsh
        run: |
          $patches = @(
            'apply_source_fix.py',
            'apply_lua.py',
            'apply_zh_ui.py',
            'apply_layout_brand.py',
            'apply_ui_v2.py',
            'apply_perf_v3.py',
            'apply_brand_v4.py',
            'apply_stability_v5.py',
            'apply_panel_v5.py',
            'apply_registry_v5.py',
            'apply_panel_fix_v5.py',
            'apply_release_v5.py',
            'apply_release_thread_crt_v5.py',
            'apply_release_jobs_fix_v5.py',
            'apply_v6_native_ui.py',
            'apply_v61_custom_pages.py',
            'apply_v62_ui.py',
            'apply_nix_luajit.py',
            'apply_ui_input_map.py',
            'apply_cfg_shot.py'
          )
          foreach ($patch in $patches) {
            "===== $patch =====" | Tee-Object -FilePath release/PATCH.log -Append
            python "velocity-build/$patch" mcb-src 2>&1 | Tee-Object -FilePath release/PATCH.log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate responsive UI input mapping
        shell: pwsh
        run: |
          @'
          #include <cassert>
          #include <cmath>
          #include "velocity-build/overlay/ui_coordinate_map.hpp"

          static bool near(float a,float b){ return std::fabs(a-b)<0.001f; }

          int main()
          {
              using xui::coord::client_to_viewport;

              auto p=client_to_viewport(960,540,1920,1080,1440,1080);
              assert(near(p.x,720) && near(p.y,540));

              p=client_to_viewport(720,540,1440,1080,1440,1080);
              assert(near(p.x,720) && near(p.y,540));

              p=client_to_viewport(1280,720,2560,1440,1920,1080);
              assert(near(p.x,960) && near(p.y,540));

              p=client_to_viewport(640,360,1280,720,1920,1080);
              assert(near(p.x,960) && near(p.y,540));

              p=client_to_viewport(100,200,0,0,1440,1080);
              assert(near(p.x,100) && near(p.y,200));

              return 0;
          }
          '@ | Set-Content ui_coordinate_map_test.cpp -Encoding ascii

          $devcmd = "$env:VSROOT\Common7\Tools\VsDevCmd.bat"
          $cmd = '"' + $devcmd + '" -arch=x64 -host_arch=x64 && cl /MT /nologo /EHsc /std:c++20 /I. ui_coordinate_map_test.cpp /Fe:ui_coordinate_map_test.exe'
          cmd.exe /d /s /c $cmd 2>&1 | Tee-Object -FilePath release/UI_COORDINATE_TEST_BUILD.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\ui_coordinate_map_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'UI coordinate test failed' }

          $xui='mcb-src\cs2\MCB-CS2\project\external\xdraw\xui\xui.cpp'
          foreach($marker in @(
            'ui_coordinate_map.hpp',
            'update_mouse_position',
            'GetClientRect',
            'xdraw::viewport_size',
            'WM_KILLFOCUS',
            'slider_interaction',
            'interaction = extended.expand',
            'swatch_interaction'
          )){
            if(-not (Select-String -LiteralPath $xui -SimpleMatch $marker -Quiet)){
              throw "missing UI integration marker: $marker"
            }
          }

          'ui_client_to_viewport_map=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'ui_1440_math_regression=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'ui_larger_hit_targets=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'ui_focus_loss_cleanup=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'ui_1440_in_game=NOT_TESTED' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Validate CFG preset and shot evidence integration
        shell: pwsh
        run: |
          $root='mcb-src\cs2\MCB-CS2'
          $checks=@(
            @("$root\project\core\mcb\mcb_presets.cpp",'verify_untouched'),
            @("$root\project\core\mcb\mcb_presets.cpp",'config::registry::save'),
            @("$root\project\core\mcb\mcb_presets.cpp",'config::registry::load'),
            @("$root\project\core\mcb\mcb_shot_evidence.cpp",'shot_evidence.jsonl'),
            @("$root\project\core\features\misc\impl\impacts.cpp",'::mcb::shot_evidence::request'),
            @("$root\project\core\features\misc\impl\impacts.cpp",'::mcb::shot_evidence::weapon_fire'),
            @("$root\project\core\features\misc\impl\impacts.cpp",'::mcb::shot_evidence::impact'),
            @("$root\project\core\features\misc\impl\impacts.cpp",'::mcb::shot_evidence::hurt'),
            @("$root\project\core\features\misc\impl\impacts.cpp",'::mcb::shot_evidence::miss'),
            @("$root\project\core\systems\impl\events.cpp",'m_events[ "weapon_fire" ]'),
            @("$root\project\core\rendering\ui_views_v62.inl",'Native gameplay presets'),
            @("$root\project\core\rendering\ui_views_v62.inl",'PARTIAL preset -> FULL native registry CFG')
          )
          foreach($item in $checks){
            if(-not (Select-String -LiteralPath $item[0] -SimpleMatch $item[1] -Quiet)){
              throw "missing cfg/shot integration marker: $($item[1])"
            }
          }

          $report=Get-Content 'mcb-src\MCB_CFG_SHOT_APPLIED.txt' -Raw
          foreach($marker in @(
            'preset_semantics=PARTIAL',
            'saved_cfg_semantics=FULL_NATIVE_REGISTRY',
            'cfg_full_snapshot=ENABLED',
            'cfg_failure_rollback=ENABLED',
            'rage_algorithm_changed=NO',
            'hitchance_changed_by_diagnostics=NO',
            'in_game_verification=NOT_TESTED'
          )){
            if(-not $report.Contains($marker)){ throw "missing report marker: $marker" }
          }

          'native_cfg_presets_compiled_source=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'shot_evidence_source_integration=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'shot_evidence_changes_rage_logic=NO' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'native_cfg_in_game=NOT_TESTED' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'shot_evidence_in_game=NOT_TESTED' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Pin built LuaJIT hash into runtime manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'luajit\src\lua51.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = 'mcb-src\cs2\MCB-CS2\project\core\scripting\nix_luajit_manifest.hpp'
          if (-not (Test-Path $manifest)) { throw 'generated Nix LuaJIT manifest missing' }
          @"
          #pragma once
          #define MCB_NIX_LUAJIT_REVISION "a4f56a459a588ae768801074b46ba0adcfb49eb1"
          #define MCB_NIX_LUAJIT_VERSION "LuaJIT 2.1.1736781742"
          #define MCB_NIX_LUAJIT_SHA256 "$hash"
          "@ | Set-Content $manifest -Encoding ascii
          "lua51_sha256=$hash" | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt
          'runtime_hash_manifest=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Validate dual runtime source integration
        shell: pwsh
        run: |
          $root = 'mcb-src\cs2\MCB-CS2'
          $checks = @(
            @("$root\project\core\scripting\nix_runtime.cpp", 'LuaJIT 2.1.1736781742'),
            @("$root\project\core\scripting\nix_runtime.cpp", 'require("ffi")'),
            @("$root\project\core\scripting\nix_runtime.cpp", 'scripts" / L"nixware" / L"enabled'),
            @("$root\project\core\scripting\nix_runtime.cpp", 'LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR'),
            @("$root\project\core\scripting\nix_value_bootstrap.hpp", 'ffi.metatype("mcb_nix_vec3"'),
            @("$root\project\core\scripting\nix_entity_bridge.cpp", 'get_local_player_pawn'),
            @("$root\project\core\scripting\nix_entity_bridge.cpp", 'lua_pushlightuserdata'),
            @("$root\project\core\scripting\nix_entity_bridge.cpp", 'systems::schemas::try_lookup'),
            @("$root\project\core\scripting\nix_cvar_bridge.cpp", 'addresses::globals::cvar->find'),
            @("$root\project\core\scripting\nix_engine_bridge.cpp", 'engine_client_cmd'),
            @("$root\project\core\scripting\nix_event_bridge.cpp", 'game_event_get_pawn'),
            @("$root\project\core\scripting\nix_render_bridge.cpp", 'xdraw::get(xdraw::layer::top)'),
            @("$root\project\core\scripting\nix_render_bridge.cpp", '__mcb_render_setup_font'),
            @("$root\project\core\scripting\nix_render_bridge.cpp", 'xdraw::measure_text'),
            @("$root\project\core\scripting\nix_engine_bridge.cpp", 'CCSGO_HudVoiceStatus'),
            @("$root\project\core\scripting\nix_event_bridge.cpp", 'game_event_get_string_fn'),
            @("$root\project\core\scripting\nix_render_bootstrap.hpp", 'function render.world_to_screen'),
            @("$root\project\core\systems\impl\events.cpp", 'scripting::g_nix.on_game_event'),
            @("$root\project\core\rendering\ui_views_v62.inl", 'Import / Approve Nixware Lua'),
            @("$root\project\core\scripting\nix_runtime.cpp", 'cb1088936c2871fa8d8332611fc7c7f409fcbbb4a69c08d77f3ca86f5e095794'),
            @("$root\project\core\hooks\impl\cheat.cpp", 'scripting::g_nix.on_override_view'),
            @("$root\project\entry.cpp", 'scripting::g_nix.initialize'),
            @("$root\project\entry.cpp", 'scripting::g_nix.shutdown'),
            @("$root\project\core\rendering\impl\context.cpp", 'scripting::g_nix.on_frame'),
            @("$root\MCB-CS2.vcxproj", 'project\core\scripting\nix_runtime.cpp')
          )
          foreach ($c in $checks) {
            if (-not (Select-String -LiteralPath $c[0] -SimpleMatch $c[1] -Quiet)) {
              throw "missing integration marker: $($c[1])"
            }
          }
          'dual_runtime_source_integration=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Build MCB Ship x64
        shell: pwsh
        run: |
          $msbuild = "$env:VSROOT\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild 'mcb-src\cs2\MCB-CS2\MCB-CS2.vcxproj' /m /t:Rebuild /p:Configuration=Ship /p:Platform=x64 /p:VcpkgRoot="$env:VCPKG_ROOT\" /nologo "/flp:logfile=$pwd\release\MSBUILD.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'mcb_ship_x64_build=PASS' | Add-Content release/NIX_RUNTIME_BUILD_STATUS.txt

      - name: Package candidate
        shell: pwsh
        run: |
          $dll = 'mcb-src\cs2\bin\MCB-CS2-v6.2-exact-panel.dll'
          $pdb = 'mcb-src\cs2\bin\MCB-CS2-v6.2-exact-panel.pdb'
          if (-not (Test-Path $dll) -or -not (Test-Path $pdb)) { throw 'MCB DLL/PDB missing' }

          New-Item -ItemType Directory -Force release\runtime | Out-Null
          New-Item -ItemType Directory -Force release\source | Out-Null

          Copy-Item $dll release\
          Copy-Item $pdb release\
          Copy-Item 'luajit\src\lua51.dll' release\runtime\
          Copy-Item 'luajit\COPYRIGHT' release\runtime\LuaJIT-COPYRIGHT.txt
          Copy-Item 'velocity-build\overlay\nix_runtime.cpp' release\source\
          Copy-Item 'velocity-build\overlay\nix_runtime.hpp' release\source\
          Copy-Item 'velocity-build\overlay\nix_value_bootstrap.hpp' release\source\
          Copy-Item 'velocity-build\overlay\nix_luajit_api.hpp' release\source\
