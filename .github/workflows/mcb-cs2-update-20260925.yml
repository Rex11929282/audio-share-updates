name: MCB CS2 September Update Port

on:
  push:
    branches: [mcb-final-integration-20260923]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mcb-cs2-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare explicit development report
        run: python velocity-build/cs2_update_20260925.py run-step 'Prepare report'

      - name: Test checked listener repair and workflow extraction
        run: |
          python velocity-build/cs2_update_20260925.py test 2>&1 | Tee-Object release/UPDATE_PATCH_TESTS.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate Windows build toolchain
        run: python velocity-build/cs2_update_20260925.py run-step 'Locate Visual Studio and vcpkg'

      - name: Fetch reviewed upstream update revision
        run: python velocity-build/cs2_update_20260925.py run-step 'Fetch pinned MCB source'

      - name: Remove unrequested webhook and repair historical patch integration
        run: python velocity-build/cs2_update_20260925.py prepare

      - name: Fetch exact LuaJIT source
        run: python velocity-build/cs2_update_20260925.py run-step 'Fetch exact LuaJIT revision'

      - name: Build exact Windows x64 LuaJIT
        run: python velocity-build/cs2_update_20260925.py run-step 'Build exact LuaJIT x64 with MSVC'

      - name: Test actual LuaJIT FFI and self-generated bytecode
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate LuaJIT version, FFI and bytecode'

      - name: Test host value bootstrap in actual LuaJIT
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate Nix LuaJIT cdata value bootstrap'

      - name: Test render bootstrap with synthetic native functions
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate Nix render Lua bootstrap'

      - name: Test independent Win32 LuaJIT DLL loader
        run: python velocity-build/cs2_update_20260925.py run-step 'Compile and run independent DLL loader smoke'

      - name: Apply existing MCB host UI CFG and evidence source patches
        run: python velocity-build/cs2_update_20260925.py run-step 'Apply MCB and Nix runtime patch chain'

      - name: Test coordinate math and inspect input integration markers
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate responsive UI input mapping'

      - name: Inspect CFG and shot integration source markers
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate CFG preset and shot evidence integration'

      - name: Pin actual built LuaJIT binary hash
        run: python velocity-build/cs2_update_20260925.py run-step 'Pin built LuaJIT hash into runtime manifest'

      - name: Inspect dual runtime source integration
        run: python velocity-build/cs2_update_20260925.py run-step 'Validate dual runtime source integration'

      - name: Audit checked listener and absence of upstream webhook call
        run: python velocity-build/cs2_update_20260925.py audit

      - name: Rebuild actual MCB Windows x64 source candidate
        run: python velocity-build/cs2_update_20260925.py run-step 'Build MCB Ship x64'

      - name: Package separately identified source candidate
        run: python velocity-build/cs2_update_20260925.py package

      - name: Preserve failure evidence without claiming a release
        if: failure()
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          @(
            'workflow_result=FAIL'
            'new_game_dll_release=NO'
            'in_game_runtime=NOT_TESTED'
            "commit=$env:GITHUB_SHA"
            "run=$env:GITHUB_RUN_ID"
          ) | Set-Content release/UPDATE_FAILURE.txt -Encoding utf8

      - name: Preserve exact patch inputs
        if: always()
        run: |
          New-Item -ItemType Directory -Force release/build-inputs | Out-Null
          Copy-Item velocity-build/cs2_update_20260925.py release/build-inputs/
          Copy-Item velocity-build/apply_cfg_shot.py release/build-inputs/
          Copy-Item .github/workflows/mcb-cs2-update-20260925.yml release/build-inputs/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MCB-CS2-Update-Port-${{ github.run_id }}
          path: release
          if-no-files-found: error
          retention-days: 30
